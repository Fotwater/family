<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дмитрий Андреевич — биография</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#c49a52; --gold-soft:#e0b56b;
    --text:#efe1c2; --muted:#b89e71;
  }
  body{
    background:linear-gradient(to bottom,#1a140d,#120d08);
    color:var(--text);
    font-family:"Cormorant Garamond", serif;
    max-width:760px;
    margin:0 auto;
    padding:60px 24px;
    line-height:1.7;
    min-height:100vh;
  }
  h1{
    font-family:"Cinzel", serif;
    color:var(--gold-soft);
    margin-bottom:8px;
    letter-spacing:.05em;
  }
  .years{ color:var(--gold); margin-bottom:30px; }
  a.back{
    display:inline-block;
    margin-top:40px;
    color:var(--gold);
    text-decoration:none;
    border-bottom:1px solid #6a4f26;
  }
  a.back:hover { color:var(--gold-soft); }
</style>
</head>
<body>

  <h1>Коростылев Дмитрий Андреевич</h1>
  <div class="years">2012 — по настоящее время</div>

  <p>Родился в 2012 году в городе Кореновск.</p>

  <p><strong>Школа:</strong> учится в Пролетарской школе.</p>

  <p><strong>Семья:</strong> мать — Ирина, отец — Андрей (Коростылев Андрей Вячеславович).</p>

  <p><em>Итог: родился в Кореновске, сейчас школьник Пролетарской школы.</em></p>
